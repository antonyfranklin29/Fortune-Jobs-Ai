name: Refresh public job search pages
on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * *'
permissions:
  contents: write
concurrency:
  group: job-seo-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test and rebuild from the public catalogue
        run: |
          node --test tests/job-seo.mjs
          node scripts/build-job-seo.mjs
      - name: Sanity-check the rebuilt pages
        run: |
          set -euo pipefail
          # Refuse to publish an obviously broken rebuild (empty catalogue read, failed fetch).
          pages=$(find jobs -name index.html | wc -l)
          urls=$(grep -c '<loc>' sitemap.xml)
          echo "pages=$pages sitemap_urls=$urls"
          if [ "$pages" -lt 200 ] || [ "$urls" -lt 100 ]; then echo "Rebuild looks incomplete; not publishing."; exit 1; fi
      - name: Publish to the live site
        run: |
          set -euo pipefail
          git add -A -- ':(glob)jobs/**/index.html' jobs/index.html sitemap.xml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh generated job search pages'
          git pull --rebase origin main
          git push origin HEAD:main
