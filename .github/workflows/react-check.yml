name: React migration checks

on:
  pull_request:
    paths:
      - 'react/**'
      - 'glass.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
        working-directory: react
      - run: npm test
        working-directory: react
      - run: npm run build
        working-directory: react
