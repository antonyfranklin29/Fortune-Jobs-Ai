name: Public job catalogue health
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check public catalogue freshness and US state coverage
        run: node scripts/catalogue-health.mjs
